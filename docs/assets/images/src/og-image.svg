<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9f8"/>
      <stop offset="1" stop-color="#dcebe7"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- wordmark -->
  <text x="60" y="96" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#0f766e" letter-spacing="-1">johna.kiwi</text>

  <!-- title -->
  <text x="58" y="236" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="92" font-weight="700" fill="#0b1c24" letter-spacing="-3">ACM &amp; AWS</text>
  <text x="58" y="340" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="92" font-weight="700" fill="#0b1c24" letter-spacing="-3">Private CA</text>

  <!-- subtitle -->
  <text x="60" y="416" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="30" font-weight="400" fill="#3d5560">Public internet trust &#183; private PKI</text>

  <!-- diagram panel -->
  <rect x="606" y="150" width="534" height="330" rx="22" fill="none" stroke="#9fc3bb" stroke-width="2"/>

  <!-- ===== Public TLS card (left) ===== -->
  <g transform="translate(648,210)">
    <rect x="0" y="0" width="190" height="210" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <!-- globe -->
    <g transform="translate(95,78)" stroke="#0f766e" stroke-width="3.5" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="40"/>
      <ellipse cx="0" cy="0" rx="16" ry="40"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="-34" y1="-22" x2="34" y2="-22"/>
      <line x1="-34" y1="22" x2="34" y2="22"/>
    </g>
    <!-- lock badge -->
    <g transform="translate(132,96)">
      <circle cx="0" cy="0" r="20" fill="#0f766e"/>
      <rect x="-9" y="-3" width="18" height="14" rx="2.5" fill="#ffffff"/>
      <path d="M -6 -3 v -4 a 6 6 0 0 1 12 0 v 4" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g>
    <text x="95" y="162" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" fill="#0b1c24">ACM public</text>
    <text x="95" y="186" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="15" fill="#3d5560">ALB &#183; browser trust</text>
  </g>

  <!-- ===== Private TLS card (right) ===== -->
  <g transform="translate(908,210)">
    <rect x="0" y="0" width="190" height="210" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <!-- shield + cert -->
    <g transform="translate(95,78)">
      <path d="M 0 -42 L 36 -28 V 6 C 36 30 20 44 0 52 C -20 44 -36 30 -36 6 V -28 Z" fill="none" stroke="#0f766e" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-18" y="-18" width="36" height="26" rx="3" fill="#0f766e"/>
      <circle cx="0" cy="18" r="7" fill="none" stroke="#0f766e" stroke-width="3.5"/>
      <path d="M -3 23 L -5 38 L 0 33 L 5 38 L 3 23" fill="#0f766e"/>
    </g>
    <text x="95" y="162" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" fill="#0b1c24">Private CA</text>
    <text x="95" y="186" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="15" fill="#3d5560">ALB &#183; intranet PKI</text>
  </g>

  <!-- connector between the two cards -->
  <g stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="840" y1="315" x2="906" y2="315" stroke-dasharray="2 8"/>
  </g>
  <circle cx="873" cy="315" r="5" fill="#0f766e"/>
</svg>
